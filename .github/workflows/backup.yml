# Daily database backup, with a restore that's actually tried every time:
# the live database is dumped, restored into a throwaway Postgres in this
# job, and every table's row count compared (scripts/backup-and-verify.sh).
# The verified dump is kept, encrypted, as an artifact of the run for 30
# days. A failed run means the backup can't be trusted - GitHub emails the
# repository's admins about failed scheduled runs.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   PROD_DATABASE_URL  the live database's connection string (Neon: the
#                      direct one, not "-pooler")
#   BACKUP_PASSPHRASE  a long passphrase; keep a copy somewhere safe - the
#                      backups can't be opened without it
# See docs/BACKUP-AND-RESTORE.md.
name: Database backup

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC = 02:30 Lagos, every day
  workflow_dispatch: # "Run workflow" button, for a backup on demand

jobs:
  backup:
    runs-on: ubuntu-latest
    services:
      restore-check:
        image: postgres:17
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore_check
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restore" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$PROD_DATABASE_URL" ] || { echo "::error::Add the PROD_DATABASE_URL secret (see docs/BACKUP-AND-RESTORE.md)"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Add the BACKUP_PASSPHRASE secret (see docs/BACKUP-AND-RESTORE.md)"; exit 1; }
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Back up, restore and compare
        env:
          SOURCE_URL: ${{ secrets.PROD_DATABASE_URL }}
          RESTORE_URL: postgresql://restore:restore@localhost:5432/restore_check
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          echo "BACKUP_NAME=crm-backup-$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          OUT="crm-backup-$(date -u +%Y-%m-%d).dump" scripts/backup-and-verify.sh
      - name: Keep the verified, encrypted backup (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
